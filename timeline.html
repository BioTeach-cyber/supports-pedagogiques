<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Timeline des cours</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f3f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 34px max(24px, calc((100% - 1380px) / 2)); color: #fff; background: #111827; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); }
    header p { margin: 8px 0 0; color: #cbd5e1; }
    main { max-width: 1380px; margin: 0 auto; padding: 26px 24px 48px; }
    .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; margin-bottom: 22px; padding: 16px; border: 1px solid #e0e5ed; border-radius: 12px; background: #fff; }
    .field { display: grid; gap: 6px; color: #64748b; font-size: .82rem; font-weight: 700; }
    select, input { min-width: 190px; padding: 10px 12px; border: 1px solid #d5dbe5; border-radius: 8px; color: #172033; background: #fff; font: inherit; }
    input { min-width: min(260px, 100%); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .summary { margin: 0 0 16px; color: #64748b; }
    .timeline-shell { min-height: 320px; overflow: hidden; border: 1px solid #e0e5ed; border-radius: 12px; background: #fff; }
    #timeline { min-height: 320px; }
    .vis-timeline { border: 0; font-family: inherit; }
    .vis-item { border-radius: 6px; }
    .vis-item.timeline-item-cours { border-color: #4f8c55; background: #e7f1e8; }
    .vis-item.timeline-item-evaluations { border-color: #c94f58; background: #fae9ea; }
    .vis-item.timeline-item-vacances { border-color: #4287bd; background: #e6f0f8; }
    .vis-item.timeline-item-stages { border-color: #829a3c; background: #eff3e3; }
    .vis-item.timeline-item-examens { border-color: #8053ad; background: #f0eaf6; }
    .empty, .error { padding: 38px 16px; color: #64748b; text-align: center; }
    .error { color: #b42318; }
    .details { margin-top: 18px; padding: 18px 20px; border: 1px solid #e0e5ed; border-left: 5px solid var(--category-color, #64748b); border-radius: 10px; background: #fff; }
    .details h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .details p { margin: 6px 0; color: #475569; line-height: 1.5; }
    .page-link { display: inline-block; margin: 8px 12px 0 0; color: #1d4ed8; font-weight: 700; }
    .undated { margin-top: 26px; padding: 18px 20px; border: 1px solid #e0e5ed; border-radius: 12px; background: #fff; }
    .undated h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .undated > p { margin: 0 0 14px; color: #64748b; font-size: .9rem; }
    .undated-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
    .undated-list li { padding: 9px 11px; border-radius: 7px; background: #f3f5f9; font-size: .87rem; }
    .undated-list span { display: block; margin-top: 3px; color: #64748b; font-size: .77rem; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { header { padding-top: 26px; padding-bottom: 26px; } main { padding: 18px 14px 36px; } .filters { align-items: stretch; flex-direction: column; } select, input { width: 100%; } }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css">
  <script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js" defer></script>
  <script src="timeline.js" defer></script>
</head>
<body>
  <header>
    <h1>Timeline des cours</h1>
    <p>Les dates des chapitres, évaluations et événements communs présents dans les fichiers de cours.</p>
  </header>
  <main>
    <div class="filters" aria-label="Filtres de la timeline">
      <label class="field">Année scolaire<select id="year-filter" aria-label="Filtrer par année scolaire"></select></label>
      <label class="field">Cours<select id="course-filter" aria-label="Filtrer par cours"><option value="all">Tous les cours</option></select></label>
      <label class="field">Catégorie<select id="category-filter" aria-label="Filtrer par catégorie"><option value="all">Toutes les catégories</option><option value="cours">Cours</option><option value="evaluations">Évaluations</option><option value="vacances">Vacances</option><option value="stages">Stages</option><option value="examens">Examens</option></select></label>
      <label class="field">Recherche<input id="search-filter" type="search" placeholder="Titre, cours…" aria-label="Rechercher un événement"></label>
    </div>
    <p id="summary" class="summary" aria-live="polite">Chargement des données…</p>
    <section class="timeline-shell" aria-label="Chronologie des événements"><div id="timeline"></div></section>
    <article id="details" class="details" aria-live="polite"><p>Sélectionnez un événement pour afficher ses détails.</p></article>
    <section class="undated" aria-labelledby="undated-heading">
      <h2 id="undated-heading">Dates à renseigner</h2>
      <p id="undated-summary">Chargement…</p>
      <ul id="undated-list" class="undated-list"></ul>
    </section>
  </main>
</body>
</html>
