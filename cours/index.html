<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7fbc48">
  <title>Cours — Mes ressources pédagogiques</title>
  <link rel="stylesheet" href="../assets/css/cours.css">
  <script src="../assets/js/lib/vis-network.min.js" defer></script>
  <script src="../assets/js/lib/lottie.min.js" defer></script>
  <script src="../assets/js/lib/qrcode.min.js" defer></script>
  <script src="../assets/js/cours.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="page-header" id="page-header">
      <a class="brand-mark" href="./" aria-label="Accueil des cours">
        <span class="brand-animation" id="brand-animation" aria-hidden="true"></span>
      </a>
      <h1 id="page-title">Cours</h1>
      <button class="qr-wrap" id="qr-open" type="button" aria-label="Agrandir le QR code de cette page" aria-haspopup="dialog">
        <span id="page-qr" class="page-qr" aria-hidden="true"></span>
      </button>
      <dialog class="qr-dialog" id="qr-dialog" aria-label="QR code de cette page">
        <button class="qr-dialog-close" id="qr-close" type="button" aria-label="Fermer le QR code">×</button>
        <div id="page-qr-large" class="page-qr-large" aria-label="QR code agrandi"></div>
        <p>Scannez pour ouvrir cette page</p>
      </dialog>
    </header>
    <main id="page-content" class="page-content" tabindex="-1">
    </main>
    <footer class="site-footer">
      <a href="../">Accueil du site</a>
      <span>Ressources pédagogiques</span>
    </footer>
  </div>
</body>
</html>
