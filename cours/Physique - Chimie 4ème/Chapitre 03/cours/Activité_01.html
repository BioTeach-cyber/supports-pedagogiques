        <script type="text/markdown">
## 🔹 Les 3 états de la matière

La matière qui nous entoure existe sous **trois états physiques** :

- **Solide** 🧊 (exemple : un glaçon)
- **Liquide** 💧 (exemple : l'eau du robinet)
- **Gaz** 💨 (exemple : l'air)


## 🔹 Comment reconnaître un état ? Les propriétés

| Propriété | Solide 🧊 | Liquide 💧 | Gaz 💨 |
|---|---|---|---|
| **Forme** | Propre (elle ne change pas) | Variable (prend la forme du récipient) | Variable (prend la forme du récipient) |
| **Volume** | Fixe | Fixe | Variable (occupe tout l'espace disponible) |
| **Compressible ?** | ❌ Non | ❌ Non | ✅ Oui (on peut le comprimer) |


## 🔹 Les mots importants

- **Forme propre** : l'objet garde sa forme tout seul, même sans récipient.
- **Volume** : la place occupée par la matière.
- **Compressible** : on peut réduire son volume en appuyant dessus (comme avec une seringue remplie d'air).


## 🔹 Exemples du quotidien

| Solide 🧊 | Liquide 💧 | Gaz 💨 |
|---|---|---|
| Un caillou | Le lait | L'air d'un ballon |
| Une table | L'huile | La vapeur d'eau |
| Le sucre en morceau | Le jus d'orange | Le gaz de la gazinière |


## 🔹 Astuces pour ne pas se tromper

- ⚠️ **Le sable et la farine** sont des **solides** : chaque petit grain est un solide, même si le tas "coule".
- ⚠️ **Un nuage ou la buée** ne sont pas des gaz : ce sont de minuscules gouttelettes d'eau **liquide**.
- 💡 **Pour trouver l'état** : je me pose 3 questions
  1. L'objet garde-t-il sa forme tout seul ?
  2. Occupe-t-il toute la place disponible ?
  3. Peut-on le comprimer ?


✅ **En une phrase** : *Un solide a une forme propre, un liquide prend la forme de son récipient, un gaz occupe tout l'espace et se comprime.*
