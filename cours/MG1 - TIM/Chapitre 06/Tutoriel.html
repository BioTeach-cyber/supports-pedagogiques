// Affiche toute erreur à l'écran (aide au diagnostic)
function montrerErreur(msg) {
  var e = document.getElementById("erreur");
  e.style.display = "block";
  e.textContent = "⚠️ " + msg;
}
function recolorerLottie(data, color) {
  var rgb = color.slice(1).match(/.{2}/g).map(function (channel) { return parseInt(channel, 16) / 255; });
  function recolorer(value) {
    if (Array.isArray(value)) {
      if ((value.length === 3 || value.length === 4) && value.every(function (channel) { return typeof channel === "number" && channel >= 0 && channel <= 1; })) {
        var black = Math.max(value[0], value[1], value[2]) < 0.02;
        return (black ? [0, 0, 0] : rgb).concat(value.length === 4 ? value[3] : 1);
      }
      if (typeof value[0] === "number" && value[0] > 1 && value.length >= 5) {
        var gradient = value.slice();
        for (var stop = 0; stop < Math.floor(gradient[0]); stop += 1) {
          var offset = 1 + stop * 4;
          if (offset + 3 >= gradient.length) break;
          var isBlack = Math.max(gradient[offset + 1], gradient[offset + 2], gradient[offset + 3]) < 0.02;
          gradient.splice(offset + 1, 3, ...(isBlack ? [0, 0, 0] : rgb));
        }
        return gradient;
      }
      return value.map(recolorer);
    }
    if (!value || typeof value !== "object") return value;
    if (Array.isArray(value.k)) {
      var result = Object.assign({}, value);
      result.k = value.a === 1
        ? value.k.map(function (frame) {
          if (!frame || typeof frame !== "object") return frame;
          var next = Object.assign({}, frame);
          if (Array.isArray(frame.s)) next.s = recolorer(frame.s);
          if (Array.isArray(frame.e)) next.e = recolorer(frame.e);
          return next;
        })
        : recolorer(value.k);
      return result;
    }
    Object.keys(value).forEach(function (key) {
      var item = value[key];
      if (key === "c" && item && typeof item === "object" && "k" in item) value[key] = Object.assign({}, item, { k: recolorer(item.k) });
      else if (key === "sc" && typeof item === "string" && /^#[\\da-f]{6}$/i.test(item)) value[key] = item.toLowerCase() === "#000000" ? "#000000" : color;
      else value[key] = recolorer(item);
    });
    return value;
  }
  return recolorer(JSON.parse(JSON.stringify(data)));
}
window.onerror = function (msg) { mostrarError("Erreur : " + msg); };

window.addEventListener("load", async function () {
  try {
    var root = new URL("../../../", location.href);
    var courseId = document.body.dataset.course;
    var response = await fetch(new URL("cours/" + encodeURIComponent(courseId) + "/cours.json", root));
    if (!response.ok) throw new Error("Le cours est introuvable.");
    var course = await response.json();
    var tutorial = (course.chapitres || []).find(function (item) { return item.type === "tutoriel"; });
    if (!tutorial) throw new Error("Les informations du tutoriel sont introuvables.");
    var color = tutorial.couleur || course.couleur || "#53a4db";
    document.documentElement.style.setProperty("--course-color", color);
    document.getElementById("page-header").style.setProperty("--course-color", color);
    document.querySelector('meta[name="theme-color"]').content = color;
    document.getElementById("tutoriel-title").textContent = tutorial.titre || "Tutoriels";
    document.title = (tutorial.titre || "Tutoriels") + " — " + course.titre;
    var courseUrl = new URL("cours/?cours=" + encodeURIComponent(courseId), root).href;
    document.getElementById("course-link").href = courseUrl;
    document.getElementById("footer-link").href = courseUrl;
    if (window.lottie && (tutorial.lottie || course.lottie)) {
      var animationResponse = await fetch(new URL(tutorial.lottie || course.lottie, root));
      if (animationResponse.ok) {
        window.lottie.loadAnimation({ container: document.getElementById("course-lottie"), renderer: "svg", loop: true, autoplay: true, animationData: recolorerLottie(await animationResponse.json(), color) });
      }

    if (window.QRCode) {

    }

                 "Distinguer les séries à comparer et les nommer explicitement."],
      conseils:["Montrer l'outil « Texte » de GeoGebra.",
                "Donner un exemple : grandeur = temps de trajet, unité = minutes."],
      mots:["grandeur","unité","série"] },
    { id:"GG2", titre:"Saisir une série dans le tableur", outil:"geogebra", crit:"C2", x:450, y:990,
      objectifs:["Saisir la série dans le tableur sans erreur ni valeur manquante."],
      conseils:["Montrer comment afficher le tableur (menu Affichage).",
                "Expliquer le piège de la virgule et du point décimal."],
      mots:["tableur","cellule","série"] },
    { id:"GG3", titre:"Calculer et contrôler les 5 indicateurs", outil:"geogebra", crit:"C2", x:450, y:1120,
      objectifs:["Relever les cinq indicateurs de la boîte (minimum, Q1, médiane, Q3, maximum).",
                 "Contrôler la cohérence des valeurs relevées avec les données de départ (ordre de grandeur, unité)."],
      conseils:["Montrer l'outil « Statistiques à une variable ».",
                "Expliquer pourquoi une médiane plus grande que le maximum est impossible."],
      mots:["minimum","quartile","médiane","maximum"] },
    { id:"GG4", titre:"Tracer et régler les boîtes à moustaches", outil:"geogebra", crit:"C3", x:900, y:990,
      objectifs:["Régler la fenêtre graphique pour que la ou les boîtes soient entièrement visibles.",
                 "Graduer et nommer l'axe des abscisses en indiquant la grandeur et son unité.",
                 "Superposer les boîtes à des hauteurs distinctes et les différencier par la couleur ou une étiquette."],
      conseils:["Expliquer la commande BoîteMoustaches( hauteur, épaisseur, liste ).",
                "Montrer les réglages du graphique (clic droit sur le fond)."],
      mots:["boîte à moustaches","abscisse","graduation"] },
    { id:"GG5", titre:"Lire et comparer des boîtes à moustaches", outil:"geogebra", crit:"C3", x:900, y:1120,
      objectifs:["Rédiger une phrase de lecture appuyée sur des valeurs chiffrées (médiane, étendue, écart interquartile).",
                 "Comparer les séries en s'appuyant sur la position et la dispersion des boîtes.",
                 "Formuler par écrit une réponse explicite à la question posée."],
      conseils:["Proposer une phrase modèle : « La moitié des … ont une valeur inférieure à … ».",
                "Comparer deux boîtes : laquelle est plus à droite ? laquelle est plus large ?"],
      mots:["étendue","écart interquartile","dispersion","position"] }
  ];

  // ===================== PRÉREQUIS (flèches) =====================
  var LIENS = [
    ["CL1","SH1"],["CL1","DOC1"],["CL1","PB11"],
    ["SH1","SH2"],["SH1","PB2"],["SH1","GG2"],["SH2","MM2"],
    ["DOC1","PB1"],["DOC1","MM1"],["DOC1","GG1"],
    ["PB1","PB2"],["PB2","PB3"],["PB3","PB4"],["PB4","PB5"],["PB5","PB6"],
    ["PB6","PB7"],["PB7","PB8"],["PB8","PB9"],["PB9","PB10"],["PB10","PB11"],["PB11","DOC2"],
    ["MM1","MM2"],["MM2","MM3"],["MM3","MM4"],["MM3","MM5"],["MM4","MM6"],["MM5","MM6"],["MM6","DOC2"],
    ["GG1","GG2"],["GG2","GG3"],["GG3","GG4"],["GG4","GG5"],["GG5","DOC2"]
  ];

  // ===================== CONSTRUCTION DU RÉSEAU =====================
  var listeNoeuds = TUTOS.map(function (t) {
    return {
      id:t.id, label:t.id + "\n" + t.titre, x:t.x, y:t.y,
      shape:"box", margin:10, borderWidth:2,
      widthConstraint:{ minimum:210, maximum:210 },
      font:{ size:14, face:"Arial", color:"#000000" },
      color:{ background:OUTILS[t.outil].couleur, border:"#333333",
              highlight:{ background:OUTILS[t.outil].couleur, border:"#000000" },
              hover:{ background:OUTILS[t.outil].couleur, border:"#000000" } },
      title:t.titre + " (" + OUTILS[t.outil].nom + ")"
    };
  });
  var titres = [
    { id:"H0", label:"DÉMARRER",      x:-450, y:-380 },
    { id:"H1", label:"C1 · ANALYSER", x:0,    y:-380 },
    { id:"H2", label:"C2 · TRAITER",  x:450,  y:-380 },
    { id:"H3", label:"C3 · EXPOSER",  x:900,  y:-380 },
    { id:"H4", label:"CONCLURE",      x:1350, y:-380 }
  ];
  titres.forEach(function (h) {
    listeNoeuds.push({ id:h.id, label:h.label, x:h.x, y:h.y, shape:"text",
                       font:{ size:26, face:"Arial", color:"#37474F" } });
  });

  var noeuds = new vis.DataSet(listeNoeuds);
  var aretes = new vis.DataSet(LIENS.map(function (l, i) {
    return { id:"E" + i, from:l[0], to:l[1] };
  }));

  var reseau = new vis.Network(
    document.getElementById("reseau"),
    { nodes:noeuds, edges:aretes },
    {
      physics:{ enabled:false },
      layout:{ randomSeed:1 },
      interaction:{ dragNodes:false, hover:true, zoomView:true, dragView:true },
      edges:{ arrows:{ to:{ enabled:true, scaleFactor:0.7 } }, width:1.5,
              color:{ color:"#90A4AE", highlight:"#1565C0", hover:"#1565C0" },
              smooth:{ enabled:true, type:"cubicBezier", forceDirection:"horizontal", roundness:0.4 } }
    }
  );
  reseau.once("afterDrawing", function () { reseau.fit(); });

  // ===================== FILTRES PAR OUTIL =====================
  var zoneFiltres = document.getElementById("filtres");
  var html = '<button data-outil="tous" class="actif" style="background:#fff">Tout afficher</button>';
  Object.keys(OUTILS).forEach(function (k) {
    html += '<button data-outil="' + k + '" style="background:' + OUTILS[k].couleur + '">' + OUTILS[k].nom + '</button>';
  });
  zoneFiltres.innerHTML = html;

  function filtrer(outil) {
    noeuds.update(TUTOS.map(function (t) {
      var visible = (outil === "tous") || (t.outil === outil) || (t.id === "DOC2");
      return { id:t.id, hidden:!visible };
    }));
    zoneFiltres.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("actif", b.getAttribute("data-outil") === outil);
    });
    reseau.fit({ animation:{ duration:500 } });
  }
  zoneFiltres.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { filtrer(b.getAttribute("data-outil")); });
  });

  // ===================== PANNEAU =====================
  var panneau = document.getElementById("panneau");

  function accueil() {
    var legende = "";
    Object.keys(OUTILS).forEach(function (k) {
      legende += '<div><span class="carre" style="background:' + OUTILS[k].couleur + '"></span>' + OUTILS[k].nom + '</div>';
    });
    panneau.innerHTML =
      '<h1>Carte des tutoriels</h1>' +
      '<p>Cette carte te montre <strong>tous les tutoriels à construire</strong> et <strong>dans quel ordre</strong>.</p>' +
      '<p>👉 Clique sur un tutoriel pour savoir ce qu\'il doit contenir.<br>' +
      '👉 Une flèche veut dire : « il faut savoir faire ceci <em>avant</em> ».<br>' +
      '👉 Molette de la souris = zoom. Clic maintenu sur le fond = déplacer.</p>' +
      '<div class="boite conseils"><h3>📝 Comment construire ton tutoriel</h3><ol>' +
      '<li><strong>Titre et code</strong> (ex. : PB3 – Nettoyer les données)</li>' +
      '<li><strong>À quoi ça sert ?</strong> 2 lignes + un exemple du métier</li>' +
      '<li><strong>Avant de commencer :</strong> les tutoriels à connaître</li>' +
      '<li><strong>Les étapes :</strong> 1 étape = 1 capture d\'écran annotée + 1 phrase courte</li>' +
      '<li><strong>Une analogie</strong> avec la vie de tous les jours</li>' +
      '<li><strong>Le piège à éviter</strong> et comment le corriger</li>' +
      '<li><strong>Je vérifie :</strong> 2 ou 3 questions pour le lecteur</li>' +
      '<li><strong>Mots-clés :</strong> les mots expliqués simplement</li>' +
      '</ol></div><h3>Légende</h3>' + legende;
  }

  function afficher(id) {
    var t = TUTOS.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    var avant = LIENS.filter(function (l) { return l[1] === id; }).map(function (l) { return l[0]; });
    var apres = LIENS.filter(function (l) { return l[0] === id; }).map(function (l) { return l[1]; });
    panneau.innerHTML =
      '<h2>' + t.id + ' – ' + t.titre + '</h2>' +
      '<span class="etiquette" style="background:' + OUTILS[t.outil].couleur + '">' + OUTILS[t.outil].nom + '</span>' +
      '<span class="etiquette" style="background:#ECEFF1">' + CRITERES[t.crit] + '</span>' +
      '<div class="boite objectifs"><h3>🎯 Ton tutoriel doit apprendre à :</h3><ul>' +
        t.objectifs.map(function (o) { return '<li>' + o + '</li>'; }).join("") + '</ul></div>' +
      '<div class="boite conseils"><h3>💡 Dans ton tutoriel, pense à :</h3><ul>' +
        t.conseils.map(function (c) { return '<li>' + c + '</li>'; }).join("") + '</ul></div>' +
      '<div class="boite mots"><h3>🔤 Mots-clés à expliquer :</h3>' +
        t.mots.map(function (m) { return '<span class="mot">' + m + '</span>'; }).join("") + '</div>' +
      '<p><strong>⬅️ À savoir faire avant :</strong> ' + (avant.length ? avant.join(", ") : "rien, tu peux commencer ici !") + '</p>' +
      '<p><strong>➡️ Ensuite :</strong> ' + (apres.length ? apres.join(", ") : "fin du parcours") + '</p>' +
      '<span class="retour" id="btnRetour">↩ Revenir à la méthode</span>';
    document.getElementById("btnRetour").addEventListener("click", accueil);
  }

  reseau.on("click", function (p) {
    if (p.nodes.length && String(p.nodes[0]).charAt(0) !== "H") afficher(p.nodes[0]);
  });

  accueil();
});
</script>

    </main>
    <footer class="site-footer"><a id="footer-link" href="../../../cours/?cours=MG1%20-%20TIM">Retour au cours</a><span>Ressources pédagogiques</span></footer>
  </div>
</body>
</html>
