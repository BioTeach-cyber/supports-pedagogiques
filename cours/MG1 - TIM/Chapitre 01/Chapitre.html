      <div data-component="contexte-professionnel" data-title="Contexte">
        <script type="text/markdown">
Vous effectuez un stage au sein du service « Études et Prospective » du Conseil départemental. Ce service prépare le prochain Schéma départemental de l'autonomie, un document officiel qui planifie, pour les cinq années à venir, la création de places en établissement pour les personnes âgées dépendantes. La responsable du service, madame Ferrand, doit présenter dans deux mois un dossier aux élus du département. Elle constate que le nombre de personnes atteintes de la maladie d'Alzheimer ou d'une démence apparentée augmente régulièrement, que cette maladie touche très majoritairement les personnes très âgées, et qu'elle ne frappe pas les hommes et les femmes de la même façon. Elle s'inquiète également de la répartition des établissements sur le territoire : certains habitants vivent à plus de trente kilomètres du premier EHPAD, ce qui éloigne les familles et complique les visites. Ne disposant d'aucun outil de visualisation, elle vous confie une mission : transformer deux bases de données brutes - l'une recensant les effectifs de malades par année, sexe et tranche d'âge, l'autre listant les établissements sanitaires et sociaux avec leurs adresses - en un dossier clair, chiffré et illustré, compréhensible par des élus qui ne sont ni médecins ni informaticiens.

Votre travail servira directement à justifier, ou non, l'ouverture de nouvelles places dans le département.
        </script>
      </div>
      <div data-component="problematique" data-title="Problématique">
        <script type="text/markdown">
La maladie d'Alzheimer progresse-t-elle dans le Finistère, et le territoire de la Côte des Légendes dispose-t-il d'une offre d'accueil suffisante pour y faire face ?
        </script>

  { "question": "Quels âges et quel sexe sont les plus touchés dans le Finistère ?" },
  { "question": "Les personnes atteintes d'Alzheimer sont-elles plus âgées dans le Finistère que dans les départements voisins ?" },
  { "question": "Quels établissements existent sur la Côte des Légendes, et sont-ils bien répartis sur ce territoire ?" },
  { "question": "Le nombre d'établissements de la Côte des Légendes semble-t-il cohérent avec l'évolution observée dans le Finistère ?" }
]
