<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Galerie Lottie</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 36px max(24px, calc((100% - 1280px) / 2)); color: #fff; background: #111827; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.4rem); }
    header p { margin: 8px 0 0; color: #cbd5e1; }
    main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 48px; }
    .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
    #search { width: min(100%, 420px); padding: 11px 14px; border: 1px solid #d5dbe5; border-radius: 9px; background: #fff; color: inherit; font: inherit; }
    #count { color: #64748b; font-size: .95rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .card { overflow: hidden; border: 1px solid #e0e5ed; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px #1720330a; }
    .preview { display: grid; height: 190px; place-items: center; overflow: hidden; background-color: #f8fafc; background-image: linear-gradient(45deg, #e9edf3 25%, transparent 25%), linear-gradient(-45deg, #e9edf3 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e9edf3 75%), linear-gradient(-45deg, transparent 75%, #e9edf3 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
    .preview svg { width: 100%; height: 100%; }
    .error { padding: 16px; color: #b42318; font-size: .9rem; text-align: center; }
    .details { padding: 14px; }
    .name { overflow: hidden; margin: 0 0 12px; font-size: 1rem; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px 10px; border: 1px solid #d5dbe5; border-radius: 7px; background: #fff; color: #273449; font: inherit; font-size: .83rem; cursor: pointer; }
    button:hover { border-color: #64748b; background: #f8fafc; }
    button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .empty { grid-column: 1 / -1; padding: 48px 16px; color: #64748b; text-align: center; }
    @media (max-width: 520px) { header { padding-top: 28px; padding-bottom: 28px; } main { padding: 20px 16px 36px; } .toolbar { align-items: stretch; flex-direction: column; gap: 8px; } }
  </style>
  <script src="assets/js/lib/lottie.min.js" defer></script>
  <script src="lotties.js" defer></script>
</head>
<body>
  <header>
    <h1>Galerie Lottie</h1>
    <p>Prévisualisez les animations de <code>assets/lotties</code> et copiez leur nom ou leur chemin.</p>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Rechercher une animation…" aria-label="Rechercher une animation">
      <span id="count" aria-live="polite"></span>
    </div>
    <section id="gallery" class="gallery" aria-label="Animations Lottie"></section>
  </main>
</body>
</html>
